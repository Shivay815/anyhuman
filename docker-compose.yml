services:
  anyhuman:
    build: .
    container_name: anyhuman
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - anyhuman-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  anyhuman-data:
